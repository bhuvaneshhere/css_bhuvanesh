<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        display: grid;
        justify-content: space-evenly;
        background-color: burlywood;
        grid-template-columns: auto auto auto;
        padding:10px;

    }
    .container div{
        background-color: #f1f1f1;
            border: 1px solid black;
            padding: 10px;
            text-align: center;
    }
</style>
<body>
    <p>Grid layout of 6 elements with equal space</p>
    <div class="container";>
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </div>
    
</body>
</html>
